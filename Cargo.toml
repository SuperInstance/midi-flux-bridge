[package]
name = "midi-flux-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridges tensor-midi timing schedules to FLUX coordination bytecode"
license = "MIT"
repository = "https://github.com/SuperInstance/midi-flux-bridge"
keywords = ["midi", "tensor", "flux", "timing", "coordination"]
categories = ["multimedia", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }

serde_json = "1"
